<!doctype html>
<meta charset="utf-8">
<title>Doomwall · Rules</title>
<link rel="stylesheet" href="theme.css">
<style>
  body{padding:20px;max-width:520px}
  h1{font-size:32px;margin-bottom:4px}
  h2{margin:24px 0 8px}
  p{color:var(--mute);margin:4px 0 12px;font-size:13px}
  .rule{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rule .what{flex:1;font-family:var(--mono)}
  .rule .when{color:var(--mute);font-size:12px}
  .rule.allow .what::before{content:"allow ";color:var(--ok)}
  .rule .x{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
  .rule .x:hover{color:var(--ember2)}
  .foot{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:13px}
  input[type=text],input[type=number],input[type=time]{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px var(--mono)}
  input:focus{outline:none;border-color:var(--ember)}
  label{display:block;font-size:13px;margin:10px 0 4px;color:var(--mute)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row label{margin:0}
  dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:360px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .days button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:3px 6px;font-size:11px;cursor:pointer}
  .days button.on{border-color:var(--ember);color:var(--ember2)}
  textarea{height:120px}
</style>
<h1>Rules</h1>
<p>Block a site, a path on it, or carve out an exception. Subdomains are included.</p>
<div id="rules"></div>
<div class="foot"><button id="add" class="btn primary">Add rule</button> <a href="activity.html" target="_blank">activity →</a></div>

<h2>Settings</h2>
<div class="row"><label for="pause">Pause length</label><input id="pause" type="number" min="1" max="120" style="width:60px"> <span class="muted">min</span></div>
<div class="row" style="margin-top:8px"><label for="limit">Bypasses per day</label><input id="limit" type="number" min="0" max="99" style="width:60px"> <span class="muted">0 = unlimited</span></div>
<label for="lines">Guilt lines (one per line, COUNT = attempt number; blank = built-in)</label>
<textarea id="lines"></textarea>
<div class="foot"><button id="save" class="btn primary">Save settings</button> <span id="msg" class="muted"></span></div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <label>Site</label><input type="text" id="host" placeholder="reddit.com" required style="width:100%">
    <label>Path <span class="muted">(optional)</span></label><input type="text" id="path" placeholder="/r/programming" style="width:100%">
    <label>Type</label>
    <div class="row"><label><input type="radio" name="type" value="block" checked> Block</label><label><input type="radio" name="type" value="allow"> Allow (exception)</label></div>
    <label><input type="checkbox" id="timed"> Only during…</label>
    <div id="when" hidden>
      <div class="row"><input type="time" id="from" value="09:00"> <span class="muted">to</span> <input type="time" id="to" value="18:00"></div>
      <div class="row days" id="days" style="margin-top:8px"></div>
    </div>
    <div class="foot"><button class="btn primary" value="ok">Save rule</button><button class="btn" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<script src="options.js"></script>
